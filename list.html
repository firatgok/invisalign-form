<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaydedilen Formlar - Invisalign</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .search-container {
            margin: 20px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        
        .forms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .form-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        
        .form-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        
        .form-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .form-card p {
            color: #666;
            margin: 5px 0;
            font-size: 14px;
        }
        
        .form-card .date {
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .form-card-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-view {
            background: #667eea;
            color: white;
        }
        
        .btn-view:hover {
            background: #5568d3;
        }
        
        .btn-delete {
            background: #ef4444;
            color: white;
        }
        
        .btn-delete:hover {
            background: #dc2626;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .back-btn:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kaydedilen Formlar</h1>
            <p class="subtitle">Invisalign Tedavi Formları</p>
        </header>

        <main>
            <a href="index.html" class="back-btn">← Yeni Form Oluştur</a>
            
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Hasta adı veya soyadı ile ara..."
                    onkeyup="searchForms()"
                >
                <p style="color: #666; font-size: 14px;">Toplam: <span id="totalCount">0</span> form</p>
            </div>
            
            <div id="loadingDiv" class="loading">
                <p>Formlar yükleniyor...</p>
            </div>
            
            <div id="formsGrid" class="forms-grid"></div>
            
            <div id="noResults" class="no-results" style="display: none;">
                <p>Henüz kaydedilmiş form bulunmuyor.</p>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script>
        let allForms = [];
        
        // Formları yükle
        async function loadForms() {
            if (!db) {
                document.getElementById('loadingDiv').innerHTML = '<p style="color: red;">Firebase bağlantısı kurulamadı!</p>';
                return;
            }
            
            try {
                const snapshot = await db.collection('invisalign_forms')
                    .orderBy('createdAt', 'desc')
                    .get();
                
                allForms = [];
                snapshot.forEach(doc => {
                    allForms.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                document.getElementById('loadingDiv').style.display = 'none';
                document.getElementById('totalCount').textContent = allForms.length;
                
                if (allForms.length === 0) {
                    document.getElementById('noResults').style.display = 'block';
                } else {
                    displayForms(allForms);
                }
            } catch (error) {
                console.error('Formları yükleme hatası:', error);
                document.getElementById('loadingDiv').innerHTML = '<p style="color: red;">Formlar yüklenemedi: ' + error.message + '</p>';
            }
        }
        
        // Formları görüntüle
        function displayForms(forms) {
            const grid = document.getElementById('formsGrid');
            grid.innerHTML = '';
            
            if (forms.length === 0) {
                document.getElementById('noResults').style.display = 'block';
                return;
            }
            
            document.getElementById('noResults').style.display = 'none';
            
            forms.forEach(form => {
                const card = document.createElement('div');
                card.className = 'form-card';
                
                const date = form.createdAt ? new Date(form.createdAt.seconds * 1000).toLocaleDateString('tr-TR') : 'Tarih yok';
                const hastaAdi = form.hasta_adi || '-';
                const hastaSoyadi = form.hasta_soyadi || '-';
                const hastaMI = form.hasta_mi || '';
                const hastaTipi = form.hasta_tipi || '-';
                const tedaviPaketi = form.tedavi_paketi || '-';
                
                card.innerHTML = `
                    <h3>${hastaSoyadi}, ${hastaAdi} ${hastaMI}</h3>
                    <p><strong>Hasta Tipi:</strong> ${hastaTipi}</p>
                    <p><strong>Tedavi Paketi:</strong> ${tedaviPaketi}</p>
                    <p class="date">Kayıt Tarihi: ${date}</p>
                    <div class="form-card-actions">
                        <button class="btn-small btn-view" onclick="viewForm('${form.id}')">Görüntüle</button>
                        <button class="btn-small btn-delete" onclick="deleteForm('${form.id}', '${hastaSoyadi}, ${hastaAdi}')">Sil</button>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // Arama
        function searchForms() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allForms.filter(form => {
                const hastaAdi = (form.hasta_adi || '').toLowerCase();
                const hastaSoyadi = (form.hasta_soyadi || '').toLowerCase();
                const fullName = `${hastaSoyadi} ${hastaAdi}`;
                
                return fullName.includes(searchTerm);
            });
            
            displayForms(filtered);
        }
        
        // Form görüntüle
        function viewForm(formId) {
            // index.html'e yönlendir (form ID'si ile)
            window.location.href = `index.html?view=${formId}`;
        }
        
        // Form sil
        async function deleteForm(formId, patientName) {
            if (!confirm(`"${patientName}" adlı hastanın formunu silmek istediğinizden emin misiniz?`)) {
                return;
            }
            
            try {
                await db.collection('invisalign_forms').doc(formId).delete();
                alert('Form başarıyla silindi!');
                loadForms(); // Listeyi yenile
            } catch (error) {
                console.error('Form silme hatası:', error);
                alert('Form silinemedi: ' + error.message);
            }
        }
        
        // Sayfa yüklendiğinde formları getir
        document.addEventListener('DOMContentLoaded', loadForms);
    </script>
</body>
</html>
