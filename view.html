<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Görüntüle - Invisalign</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .back-btn {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .back-btn:hover {
            background: #5568d3;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Form Görüntüle</h1>
            <p class="subtitle">Invisalign Tedavi Formu</p>
        </header>

        <main id="formContent" style="padding: 40px;">
            <a href="list.html" class="back-btn">← Formlar Listesine Dön</a>
            
            <div id="loadingDiv" style="text-align: center; padding: 60px; color: #666;">
                <p>Form yükleniyor...</p>
            </div>
            
            <div id="formContainer" style="display: none;"></div>
        </main>
        
        <footer class="action-buttons" id="actionButtons" style="display: none;">
            <button id="updateBtn" class="btn btn-success">Değişiklikleri Kaydet</button>
            <button id="pdfBtn" class="btn btn-primary">PDF Oluştur</button>
            <button id="deleteBtn" class="btn btn-secondary" style="background: #ef4444;">Formu Sil</button>
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
    
    <script>
        let currentFormId = null;
        let currentFormData = null;
        
        function getFormIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }
        
        async function loadForm() {
            currentFormId = getFormIdFromURL();
            
            if (!currentFormId) {
                document.getElementById('loadingDiv').innerHTML = '<p style="color: red;">Form ID bulunamadı!</p>';
                return;
            }
            
            if (!db) {
                document.getElementById('loadingDiv').innerHTML = '<p style="color: red;">Firebase bağlantısı kurulamadı!</p>';
                return;
            }
            
            try {
                const doc = await db.collection('invisalign_forms').doc(currentFormId).get();
                
                if (!doc.exists) {
                    document.getElementById('loadingDiv').innerHTML = '<p style="color: red;">Form bulunamadı!</p>';
                    return;
                }
                
                currentFormData = doc.data();
                
                const response = await fetch('index.html');
                const htmlText = await response.text();
                
                const parser = new DOMParser();
                const htmlDoc = parser.parseFromString(htmlText, 'text/html');
                const mainContent = htmlDoc.querySelector('main');
                
                if (mainContent) {
                    document.getElementById('formContainer').innerHTML = mainContent.innerHTML;
                    
                    // Önce verileri doldur
                    fillFormData(currentFormData);
                    
                    // Change eventlerini tetikle
                    await new Promise(resolve => setTimeout(resolve, 100));
                    triggerChangeEvents();
                    
                    // Sonra dinamik bölümleri göster
                    await new Promise(resolve => setTimeout(resolve, 100));
                    showAllSections();
                    
                    // Form butonlarını gizle (kaydet butonu hariç)
                    await new Promise(resolve => setTimeout(resolve, 200));
                    hideFormButtons();
                    
                    document.getElementById('loadingDiv').style.display = 'none';
                    document.getElementById('formContainer').style.display = 'block';
                    document.getElementById('actionButtons').style.display = 'flex';
                }
                
            } catch (error) {
                console.error('Form yükleme hatası:', error);
                document.getElementById('loadingDiv').innerHTML = '<p style="color: red;">Form yüklenemedi: ' + error.message + '</p>';
            }
        }
        
        function showAllSections() {
            // TÜM section ve form-subsection'ları göster
            const allFormSections = document.querySelectorAll('#formContainer .form-section, #formContainer .form-subsection, #formContainer section');
            allFormSections.forEach(section => {
                section.style.display = 'block';
            });
            
            // Seçilmemiş option-card'ları gizle
            const allCards = document.querySelectorAll('#formContainer .option-card');
            allCards.forEach(card => {
                const radio = card.querySelector('input[type="radio"]');
                if (radio && !radio.checked) {
                    card.style.display = 'none';
                }
            });
            
            // Özel talimatlar textarea'sını tam yükseklikte göster
            const textarea = document.getElementById('ozel_talimatlar_textarea');
            if (textarea && textarea.value) {
                const lineCount = textarea.value.split('\n').length;
                const minHeight = Math.max(lineCount * 20, 120);
                textarea.style.height = minHeight + 'px';
                textarea.style.minHeight = minHeight + 'px';
                textarea.style.overflow = 'visible';
            }
        }
        
        function triggerChangeEvents() {
            // Hasta tipi radio butonunda change eventi tetikle
            const hastaRadios = document.querySelectorAll('input[name="hasta_tipi"]');
            hastaRadios.forEach(radio => {
                if (radio.checked) {
                    radio.dispatchEvent(new Event('change', { bubbles: true }));
                }
            });
            
            // Ürün tipi radio butonunda change eventi tetikle
            const urunRadios = document.querySelectorAll('input[name="urun_tipi"]');
            urunRadios.forEach(radio => {
                if (radio.checked) {
                    radio.dispatchEvent(new Event('change', { bubbles: true }));
                }
            });
            
            // Tedavi paketi radio butonunda change eventi tetikle
            const tedaviRadios = document.querySelectorAll('input[name="tedavi_paketi"]');
            tedaviRadios.forEach(radio => {
                if (radio.checked) {
                    radio.dispatchEvent(new Event('change', { bubbles: true }));
                }
            });
        }
        
        function fillFormData(data) {
            Object.keys(data).forEach(key => {
                if (key === 'createdAt' || key === 'updatedAt') return;
                
                const inputs = document.querySelectorAll(`[name="${key}"]`);
                inputs.forEach(input => {
                    if (input.type === 'checkbox') {
                        if (Array.isArray(data[key])) {
                            if (data[key].includes(input.value)) {
                                input.checked = true;
                            }
                        } else if (data[key]) {
                            input.checked = true;
                        }
                    } else if (input.type === 'radio') {
                        if (input.value === data[key]) {
                            input.checked = true;
                        }
                    } else {
                        input.value = data[key];
                    }
                });
            });
            
            const textarea = document.getElementById('ozel_talimatlar_textarea');
            if (textarea && data.ozel_talimatlar) {
                textarea.value = data.ozel_talimatlar;
                textarea.dispatchEvent(new Event('input'));
            }
        }
        
        function hideFormButtons() {
            // Form içindeki gereksiz butonları gizle (kaydetme vs)
            document.querySelectorAll('#formContainer button').forEach(btn => {
                if (btn.id !== 'updateBtn') {
                    btn.style.display = 'none';
                }
            });
        }
        
        async function updateFormData() {
            if (!currentFormId) {
                alert('Form ID bulunamadı!');
                return;
            }
            
            if (!confirm('Formdaki değişiklikleri kaydetmek istediğinizden emin misiniz?')) {
                return;
            }
            
            try {
                const updateBtn = document.getElementById('updateBtn');
                updateBtn.disabled = true;
                updateBtn.textContent = 'Kaydediliyor...';
                
                // Tüm form verilerini topla
                const formData = {};
                
                // Text, email, tel, number inputları
                document.querySelectorAll('#formContainer input[type="text"], #formContainer input[type="email"], #formContainer input[type="tel"], #formContainer input[type="number"]').forEach(input => {
                    if (input.name) {
                        formData[input.name] = input.value;
                    }
                });
                
                // Radio buttonları
                document.querySelectorAll('#formContainer input[type="radio"]:checked').forEach(radio => {
                    if (radio.name) {
                        formData[radio.name] = radio.value;
                    }
                });
                
                // Checkboxları
                const checkboxGroups = {};
                document.querySelectorAll('#formContainer input[type="checkbox"]:checked').forEach(checkbox => {
                    if (checkbox.name) {
                        if (!checkboxGroups[checkbox.name]) {
                            checkboxGroups[checkbox.name] = [];
                        }
                        checkboxGroups[checkbox.name].push(checkbox.value);
                    }
                });
                Object.assign(formData, checkboxGroups);
                
                // Textareaları
                document.querySelectorAll('#formContainer textarea').forEach(textarea => {
                    if (textarea.name || textarea.id) {
                        const key = textarea.name || textarea.id;
                        formData[key] = textarea.value;
                    }
                });
                
                // Select elementleri
                document.querySelectorAll('#formContainer select').forEach(select => {
                    if (select.name) {
                        formData[select.name] = select.value;
                    }
                });
                
                // Güncelleme zamanını ekle
                formData.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
                
                // Firebase'e kaydet
                await db.collection('invisalign_forms').doc(currentFormId).update(formData);
                
                alert('Form başarıyla güncellendi!');
                updateBtn.disabled = false;
                updateBtn.textContent = 'Değişiklikleri Kaydet';
                
                // Formu yeniden yükle
                currentFormData = { ...currentFormData, ...formData };
                
            } catch (error) {
                console.error('Form güncelleme hatası:', error);
                alert('Form güncellenemedi: ' + error.message);
                updateBtn.disabled = false;
                updateBtn.textContent = 'Değişiklikleri Kaydet';
            }
        }
        
        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const formContainer = document.getElementById('formContainer');
            
            try {
                const canvas = await html2canvas(formContainer, {
                    scale: 1.5,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff'
                });
                
                const imgData = canvas.toDataURL('image/png');
                const doc = new jsPDF('p', 'mm', 'a4');
                
                const imgWidth = 190;
                const pageHeight = 277;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                let heightLeft = imgHeight;
                let position = 10;
                
                doc.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
                
                while (heightLeft >= 0) {
                    position = heightLeft - imgHeight + 10;
                    doc.addPage();
                    doc.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
                
                const hastaSoyadi = currentFormData.hasta_soyadi || 'hasta';
                const hastaAdi = currentFormData.hasta_adi || '';
                const fileName = `invisalign_form_${hastaSoyadi}_${hastaAdi}.pdf`;
                
                doc.save(fileName);
                alert('PDF başarıyla oluşturuldu!');
            } catch (error) {
                console.error('PDF oluşturma hatası:', error);
                alert('PDF oluşturulamadı: ' + error.message);
            }
        }
        
        async function deleteCurrentForm() {
            const hastaSoyadi = currentFormData.hasta_soyadi || '';
            const hastaAdi = currentFormData.hasta_adi || '';
            const patientName = `${hastaSoyadi}, ${hastaAdi}`;
            
            if (!confirm(`"${patientName}" adlı hastanın formunu silmek istediğinizden emin misiniz?`)) {
                return;
            }
            
            try {
                await db.collection('invisalign_forms').doc(currentFormId).delete();
                alert('Form başarıyla silindi!');
                window.location.href = 'list.html';
            } catch (error) {
                console.error('Form silme hatası:', error);
                alert('Form silinemedi: ' + error.message);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // script.js'in DOMContentLoaded eventini iptal et
            setTimeout(loadForm, 100);
        });
        
        setTimeout(() => {
            const updateBtn = document.getElementById('updateBtn');
            const pdfBtn = document.getElementById('pdfBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            
            if (updateBtn) updateBtn.addEventListener('click', updateFormData);
            if (pdfBtn) pdfBtn.addEventListener('click', generatePDF);
            if (deleteBtn) deleteBtn.addEventListener('click', deleteCurrentForm);
        }, 1500);
    </script>
</body>
</html>
